      const showDetail = (text) => {
        const tip = document.createElement('div');
        tip.className = 'tip';

      };

      const addButtons = () => {
        const ul = document.querySelector('.ul');
        if (!ul) return;
        const maxWidth = ul.getBoundingClientRect().width - 47;
        document.querySelectorAll('.li').forEach((li) => {
          const oldButton = li.querySelector('button.button');
          if (oldButton) oldButton.remove();
          const label = li.querySelector('.label');
          const info = li.querySelector('.info');
          if (!label || !info) return;
          if (info.getBoundingClientRect().width + label.getBoundingClientRect().width >= maxWidth) {
            const button = document.createElement('button');
            button.className = 'button';
            button.textContent = '详情';
            button.addEventListener('click', () => showDetail(info.textContent));
            li.appendChild(button);
          }
        });
      };

      window.addEventListener('load', addButtons);
      window.addEventListener('resize', addButtons);
    })();
